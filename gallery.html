<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | MCT Department</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

  <div id="navbar-container"></div>

  <div class="bg-slate-950 min-h-screen pt-24 pb-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

      <div class="flex flex-col md:flex-row justify-between items-end mb-16 border-b border-slate-800 pb-8">
        <div>
          <h1 class="text-4xl font-bold text-white mb-2">Project Showcase</h1>
          <p class="text-slate-400 font-light">Highlighting student innovation in creative technology.</p>
        </div>
        <button
          class="hidden md:flex items-center text-indigo-400 hover:text-indigo-300 font-mono text-sm mt-4 md:mt-0 transition">
          VIEW ARCHIVES <i data-lucide="chevron-right" class="ml-1 h-4 w-4"></i>
        </button>
      </div>

      <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Injected by JS -->
      </div>

      <div class="mt-20 text-center">
        <button
          class="inline-block px-8 py-3 border border-slate-700 text-slate-300 hover:bg-slate-800 hover:text-white rounded transition font-mono text-sm">
          LOAD MORE PROJECTS
        </button>
      </div>

    </div>
  </div>

  <div id="footer-container"></div>
  <script src="main.js"></script>
  <script>
    const PROJECTS_DATA = [];

    const grid = document.getElementById('gallery-grid');

    if (PROJECTS_DATA.length === 0) {
      grid.innerHTML = '<div class="col-span-1 md:col-span-2 text-center py-20"><p class="text-slate-500 font-mono">No projects found.</p></div>';
    } else {
      grid.innerHTML = PROJECTS_DATA.map(project => `
                <div class="group relative bg-slate-900 rounded-lg overflow-hidden border border-slate-800 hover:border-slate-700 transition-all">
                  <!-- Image -->
                  <div class="relative h-72 md:h-80 overflow-hidden">
                    <img 
                      src="${project.imageUrl}" 
                      alt="${project.title}" 
                      class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-80 group-hover:opacity-100"
                    />
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-90"></div>
                    
                    <!-- Overlay Text positioned bottom -->
                    <div class="absolute bottom-0 left-0 p-6 md:p-8 w-full">
                      <div class="flex justify-between items-end">
                        <div>
                          <span class="inline-block px-2 py-1 mb-3 text-[10px] font-mono font-bold uppercase tracking-widest text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 rounded">
                            ${project.category}
                          </span>
                          <h3 class="text-2xl font-bold text-white mb-1 leading-tight">${project.title}</h3>
                          <p class="text-slate-400 text-sm line-clamp-1">${project.description}</p>
                        </div>
                      </div>
                    </div>

                    <!-- Hover Action -->
                    <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity bg-black/50 backdrop-blur-sm p-2 rounded-full border border-white/10 text-white">
                      <i data-lucide="eye" class="h-5 w-5"></i>
                    </div>
                  </div>

                  <!-- Footer Info -->
                  <div class="px-6 py-4 bg-slate-900 border-t border-slate-800 flex justify-between items-center">
                     <div class="flex items-center gap-3">
                        <div class="h-6 w-6 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-[10px] text-white font-bold">
                          ${project.studentName.charAt(0)}
                        </div>
                        <span class="text-sm text-slate-300 font-mono">${project.studentName}</span>
                     </div>
                     <span class="text-xs text-slate-500 font-mono">2024</span>
                  </div>
                </div>
            `).join('');
    }

    lucide.createIcons();
  </script>
</body>

</html>
